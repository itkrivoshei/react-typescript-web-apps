version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    ignore:
      # Major upgrades need migration work; do them manually when wanted.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      app-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:30"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
    groups:
      actions-dependencies:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
